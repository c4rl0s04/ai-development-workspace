name: Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: workspace_migrator
          POSTGRES_PASSWORD: local-only-not-a-secret
          POSTGRES_DB: workspace_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workspace_migrator -d workspace_local"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://workspace_migrator:local-only-not-a-secret@127.0.0.1:5432/workspace_local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:db
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:browser
